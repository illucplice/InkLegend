# Builds the Android app (an APK you can download and install on a phone) on every
# push to main, and puts it on the repository's Releases page as "Latest APK".
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and its export templates
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Make a signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/inklegends.keystore" -alias inklegends \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass inklegends -keypass inklegends \
            -dname "CN=Ink Legends, O=illucplice, C=US"

      - name: Export the APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/inklegends.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: inklegends
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: inklegends
        run: |
          # Point Godot at the runner's Android SDK and Java.
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
          "$RUNNER_TEMP/godot" --headless --import > import.log 2>&1 || true
          mkdir -p build/android
          set +e
          "$RUNNER_TEMP/godot" --headless --export-debug "Android" build/android/InkLegends.apk 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e
          # Surface any errors as annotations, readable on the run page.
          grep -iE -A6 "error|fail|cannot|missing|invalid" export.log | grep -v "Unreferenced static string" | head -25 | while read -r line; do echo "::error::$line"; done || true
          ls -la build/android || true
          test -f build/android/InkLegends.apk
          exit $status

      - name: Publish it as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          body: Download InkLegends.apk on your Android phone and open it to install. You may need to allow installing apps from your browser.
          files: build/android/InkLegends.apk
          make_latest: true
