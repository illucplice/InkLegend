# Builds the Web version of Ink Legends with Godot and publishes it to GitHub Pages
# on every push to main, so the game can be played in any phone or desktop browser.
name: Publish web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and its export templates
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export the Web build
        shell: bash
        run: |
          echo "::notice::Templates: $(ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | grep -i web | tr "\n" " ")"
          "$RUNNER_TEMP/godot" --headless --import 2>&1 | tee import.log || true
          mkdir -p build/web
          set +e
          "$RUNNER_TEMP/godot" --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e
          # Surface any errors as annotations, readable on the run page.
          grep -ihE -A6 "error|fail|cannot|missing|invalid" export.log | grep -v "Unreferenced static string" | head -25 | while read -r line; do echo "::error::$line"; done || true
          grep -v "Unreferenced static string" export.log | tail -12 | while read -r line; do echo "::warning::$line"; done || true
          ls -la build/web
          exit $status

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
